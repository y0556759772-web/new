name: Proxy Downloader
run-name: dl-${{ github.event.client_payload.request_id || inputs.request_id || github.run_id }}
on:
  repository_dispatch:
    types: [download]
  workflow_dispatch:
    inputs:
      url:
        description: Video or direct file URL
        required: true
        type: string
      mode:
        description: Download mode
        type: choice
        options: [video, file]
        default: video
      quality:
        description: Quality
        type: choice
        options: [best, '1080', '720', '480', mp3]
        default: '720'
      subs:
        description: Hebrew subtitles embedded in the video
        type: choice
        options: [none, he]
        default: none
      request_id:
        description: Optional request identifier
        type: string
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      URL_IN: ${{ github.event.client_payload.url || inputs.url }}
      MODE_IN: ${{ github.event.client_payload.mode || inputs.mode }}
      QUALITY_IN: ${{ github.event.client_payload.quality || inputs.quality || 'best' }}
      SUBS_IN: ${{ github.event.client_payload.subs || inputs.subs || 'none' }}
      REQUEST_ID: ${{ github.event.client_payload.request_id || inputs.request_id || github.run_id }}
    steps:
      - name: Validate request
        run: |
          python3 - <<'PY'
          import os, re, ipaddress
          from urllib.parse import urlsplit
          u = urlsplit(os.environ['URL_IN'])
          if u.scheme not in ('http', 'https') or not u.hostname or u.username or u.password:
              raise SystemExit('Invalid HTTP(S) URL')
          host = u.hostname.lower().rstrip('.')
          if host == 'localhost' or host.endswith(('.localhost', '.local')):
              raise SystemExit('Local addresses are not supported')
          try:
              if not ipaddress.ip_address(host).is_global:
                  raise SystemExit('Non-public IP addresses are not supported')
          except ValueError:
              pass
          if os.environ['MODE_IN'] not in ('video', 'file'):
              raise SystemExit('Invalid download mode')
          if os.environ['QUALITY_IN'] not in ('best', '1080', '720', '480', 'mp3'):
              raise SystemExit('Invalid quality')
          if os.environ['SUBS_IN'] not in ('none', 'he'):
              raise SystemExit('Invalid subtitles option')
          if not re.fullmatch(r'[A-Za-z0-9_-]{1,80}', os.environ['REQUEST_ID']):
              raise SystemExit('Invalid request identifier')
          os.makedirs('output', exist_ok=True)
          PY
      - name: Install yt-dlp and ffmpeg
        if: env.MODE_IN == 'video'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -U --pre 'yt-dlp[default]' bgutil-ytdlp-pot-provider
          curl --fail --silent --show-error --location https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Start PO token provider
        if: env.MODE_IN == 'video'
        run: |
          docker run -d --name bgutil-provider -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'PO token provider did not start'
          exit 1
      - name: Download video
        if: env.MODE_IN == 'video'
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
        run: |
          set -euo pipefail
          COOKIE_PATH="$RUNNER_TEMP/youtube-cookies.txt"
          trap 'rm -f "$COOKIE_PATH"' EXIT
          export COOKIE_PATH
          python3 - <<'PY'
          import os, http.cookiejar, time
          text = os.environ.get('YT_COOKIES', '').strip()
          if not text:
              print('cookies check: secret empty; using anonymous access')
          else:
              if text.splitlines()[0].strip() not in ('# Netscape HTTP Cookie File', '# HTTP Cookie File'):
                  raise SystemExit('cookies check: invalid Netscape header; upload a cookies.txt export')
              path = os.environ['COOKIE_PATH']
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, 'w', encoding='utf-8') as f:
                  f.write(text.replace('\r\n', '\n') + '\n')
              jar = http.cookiejar.MozillaCookieJar(path)
              try:
                  jar.load(ignore_discard=True, ignore_expires=True)
              except Exception:
                  raise SystemExit('cookies check: invalid Netscape rows')
              yt = [c for c in jar if c.domain.lstrip('.') == 'youtube.com' or c.domain.endswith('.youtube.com')]
              active = [c for c in yt if c.expires in (None, 0) or c.expires > time.time()]
              login = [c for c in active if c.name in ('SID', '__Secure-1PSID', '__Secure-3PSID')]
              print(f'cookies check: youtube={len(yt)}, unexpired={len(active)}, login={len(login)}')
              print('cookies check: presence does not prove YouTube accepts the session')
              if not active:
                  raise SystemExit('cookies check: no unexpired YouTube cookies; update YT_COOKIES')
          PY
          ARGS=(--ignore-config --no-playlist --no-progress --newline --socket-timeout 30 --retries 3 --fragment-retries 3 --js-runtimes deno --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' --restrict-filenames --trim-filenames 160 -o 'output/%(title)s [%(id)s].%(ext)s')
          if [ -f "$COOKIE_PATH" ]; then ARGS+=(--cookies "$COOKIE_PATH"); fi
          if [ -n "$YT_PROXY" ]; then ARGS+=(--proxy "$YT_PROXY"); echo 'proxy: enabled'; fi
          if [ "$QUALITY_IN" = mp3 ]; then
            ARGS+=(-x --audio-format mp3)
          else
            FORMAT='bv*+ba/b'
            if [ "$QUALITY_IN" != best ]; then FORMAT="bv*[height<=$QUALITY_IN]+ba/b[height<=$QUALITY_IN]"; fi
            ARGS+=(-f "$FORMAT" --merge-output-format mp4)
            if [ "$SUBS_IN" = he ]; then
              # Hebrew subtitles (uploaded, else auto-generated) embedded into the mp4; a subtitle failure only warns
              ARGS+=(--write-subs --write-auto-subs --sub-langs 'he,iw,he-orig' --embed-subs)
            fi
          fi
          yt-dlp "${ARGS[@]}" -- "$URL_IN"
      - name: Download direct file
        if: env.MODE_IN == 'file'
        run: |
          curl --location --fail --show-error --retry 2 --max-time 1500 --proto '=http,https' --proto-redir '=http,https' --output output/downloaded-file -- "$URL_IN"
      - name: Publish as direct-download release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # remove old download releases (older than 1 day) so the repo stays clean
          CUTOFF=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name | startswith(\"dl-\")) | select(.created_at < \"$CUTOFF\") | .tag_name" | while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes || true
          done
          gh release create "dl-$REQUEST_ID" output/* --title "dl-$REQUEST_ID" --notes "temporary download" --target "${{ github.sha }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ env.REQUEST_ID }}
          path: output/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
